[package]
name = "vivac"
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
description = "Provenance tree for work: every node knows which node it was born from"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JAAvila-Of/vivac"
keywords = ["provenance", "agentic", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# `d138`: the only one of four candidates that compiles against the MSRV
# below, +5 crates. A hand-rolled listener over `std::net::TcpListener` was
# the +0 alternative and security vetoed it: the three defenses in `WEB.md`
# §4.1 are header parsing, and that is not code to write twice.
tiny_http = "0.12"

# The same `serde_json` the crate already links, so the tree gains nothing.
# The MCP tests read JSON-RPC replies, and asserting on substrings of a
# protocol is how a suite ends up green over malformed output.
[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
