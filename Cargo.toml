[package]
name = "vivac"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Arbol de procedencia del trabajo: cada nodo sabe de cual nacio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JAAvila-Of/vivac"
keywords = ["provenance", "agentic", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
