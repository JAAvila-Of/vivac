[package]
name = "vivac"
version = "0.15.9"
edition = "2021"
rust-version = "1.89"
description = "Provenance tree for work: every node knows which node it was born from"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JAAvila-Of/vivac"
keywords = ["provenance", "agentic", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
# `d138`: of four candidates, the only one that compiled against the MSRV
# of the time, 1.75, and the lightest as well, +5 crates. A hand-rolled
# listener over `std::net::TcpListener` was the +0 alternative and security
# vetoed it: the three defenses in `WEB.md` §4.1 are header parsing, and
# that is not code to write twice.
tiny_http = "0.12"

# `f577`: search folds diacritics, so `dueno` finds `dueño`. Folding needs
# canonical decomposition, which std does not have, and hand-writing
# Unicode's decomposition tables is the kind of code `d138` refused to write
# twice. +2 crates: this one and `tinyvec`.
unicode-normalization = "0.1"

# `d815`: `vivac update` checks a downloaded release archive against its
# published SHA-256 before it ever runs or installs it, and a hash that
# guards a security decision is exactly the code `d138` refuses to hand-roll
# a second time. RustCrypto's own, +1 crate.
sha2 = "0.10"

# The same `serde_json` the crate already links, so the tree gains nothing.
# The MCP tests read JSON-RPC replies, and asserting on substrings of a
# protocol is how a suite ends up green over malformed output.
[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
