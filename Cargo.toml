[package]
name = "vivac"
version = "0.3.4"
edition = "2021"
rust-version = "1.75"
description = "Provenance tree for work: every node knows which node it was born from"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JAAvila-Of/vivac"
keywords = ["provenance", "agentic", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

# The same `serde_json` the crate already links, so the tree gains nothing.
# The MCP tests read JSON-RPC replies, and asserting on substrings of a
# protocol is how a suite ends up green over malformed output.
[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
