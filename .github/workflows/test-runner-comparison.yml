name: test-runner-comparison

on:
  pull_request:
    paths:
      - '.github/workflows/test-runner-comparison.yml'
      - '.github/actions/install-nextest/action.yml'
      - '.config/nextest.toml'
      - 'tools/compare-test-runners.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-runner-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-nextest
      - name: Check the comparison helper
        run: python tools/compare-test-runners.py --self-test
      - name: Clean the package before measurement
        run: cargo clean -p vivac
      - name: Compare identical test inventories and execution
        run: python tools/compare-test-runners.py --output runner-comparison
      - name: Retain every sample and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-comparison-${{ matrix.os }}
          path: runner-comparison/
          if-no-files-found: error
          retention-days: 14
