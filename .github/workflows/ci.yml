name: ci

# `workflow_dispatch` is for the push GitHub never turns into a run, as the
# merge of #176 did not: without it, the only way to check `main` again is
# another commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./.github/actions/install-nextest
      # The Linux custody tests create their private 0700 roots under an
      # explicit TMPDIR and refuse to guess one.
      - run: cargo nextest run --locked --all-targets --no-fail-fast --retries 0
        env:
          TMPDIR: ${{ runner.temp }}
      # The Ubuntu provider retains files that must sit under a root-owned chain
      # with no group or world write, so those tests are ignored by default and
      # run here as root, reusing the build above. Running the whole suite as
      # root would let the permission refusals pass without testing anything.
      - if: runner.os == 'Linux'
        run: |
          sudo install -d -o root -g root -m 0700 /var/lib/vivac-root-tests
          sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" TMPDIR=/var/lib/vivac-root-tests cargo nextest run --locked --all-targets --no-fail-fast --retries 0 --run-ignored only -E 'test(/ubuntu_provider::tests::retained_/)'

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.89"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --locked --all-targets

  linux-custody-probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tools/native-key-store-probe/review/rust-launcher
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: TMPDIR="$RUNNER_TEMP" cargo test --locked --release --all-targets -- --test-threads=1
      - run: |
          sudo install -d -o root -g root -m 0700 /var/lib/vivac-root-tests
          sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" TMPDIR=/var/lib/vivac-root-tests cargo test --locked --release --all-targets -- --ignored --test-threads=1 ubuntu_provider::tests::retained_
      - run: cargo clippy --locked --release --all-targets -- -D warnings

  claude-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test tests/claude_opening_module.mjs
      - run: node tests/web_map_ui.cjs
      - run: node tests/web_artifacts_ui.cjs

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: python3 tools/test-third-party-notices.py
      - run: python3 -I -S -B tools/test_macos_device_key_context.py
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The profile every other step uses carries `debug_assertions`, so code
      # that only a debug-only block reaches counts as live in all of them.
      # A release build is what `cargo install` runs, and it was the one
      # profile nothing here ever built -- two dead-code warnings lived on it
      # unseen (`f635`).
      - run: cargo clippy --locked --release -- -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 tools/check-commits.py --self-test
      - run: git log --format='%B%x00' "$BASE..$HEAD" | python3 tools/check-commits.py
