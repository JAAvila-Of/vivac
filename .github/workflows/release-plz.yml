# Releasing. The version number and the changelog are computed from the commit
# messages; nothing reaches crates.io until a human merges the release pull
# request. That merge is the gate, and it is the only one.
#
# There are no stored credentials. Publishing authenticates with crates.io over
# OIDC -- GitHub signs a short-lived token, crates.io validates it against
# GitHub's public keys, and it expires within the hour. A long-lived registry
# token would be the most dangerous secret this project could hold: whoever took
# it could publish anything, as us, to everyone who installs vivac.
#
# One manual step per release, and it is a consequence of that choice. A run
# caused by GitHub's own token is held rather than skipped: it is created and
# parked in `action_required`, waiting for somebody to say run it, and `main`
# requires all of them before the release pull request can be merged.
#
# Approving the held run is the whole step. It needs no commit, and it does not
# need the pull request closed and reopened. Pushing a human commit to the
# branch starts them too, but that only helps on the releases where there was
# already a commit to make -- and reaching for it on the others means inventing
# one, which is worse than the problem. The alternative is an app or a personal
# token, which is the credential this file exists to avoid.
#
# The precompiled binaries are built here as well, in the run that made the
# release, rather than by a workflow hanging off the tag. Same rule, second
# mouth: a tag pushed with that token starts nothing either. release.yml
# carries the long version of why.

name: release-plz

# By hand as well, for the push GitHub never turns into a run: the merge of
# #176 reached `main` and started nothing, and with no way to start this by
# hand the only way to wake it was another commit. A dispatch from any other
# branch is refused by the `if:` on each job below -- releasing is `main`'s
# alone, whoever asks and from wherever.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.131
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag comes out of the JSON and not out of an output called `tag`,
      # because the version pinned above has no such output -- it reports
      # `prs`, `pr`, `releases`, `prs_created` and `releases_created`, and
      # nothing else. v0.6.8 shipped with no binaries for exactly that reason:
      # the missing output read as an empty tag and the upload skipped itself
      # in silence. `jq -e` is the point of this step: if the shape of that
      # JSON ever changes, this fails here and says so, rather than handing
      # the next job an empty string it will quietly do nothing with.
      - name: Read the tag out of what release-plz reported
        id: released
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          printf 'released: %s\n' "$RELEASES"
          tag=$(printf '%s' "$RELEASES" | jq -er '.[0].tag')
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  # The precompiled binaries, in this same run. They cannot hang off the tag:
  # GitHub starts no workflow for an event caused by its own token, and this
  # job is what release.yml exists to be called from. See its header.
  binaries:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}

  # The listing in the MCP Registry, in this same run. The registry does not
  # follow crates.io on its own: a version nobody publishes there stays the one
  # it advertises, and a step somebody has to remember is a step that gets
  # skipped. So the release publishes it, the way it publishes the crate.
  #
  # No stored credential here either. `login github-oidc` trades the same kind
  # of short-lived token crates.io takes above for the namespace of the
  # repository's owner, `io.github.JAAvila-Of`.
  #
  # server.json is written here and nowhere else. A copy in the repository would
  # carry a version, and between two releases that version would be wrong --
  # a copy with the right shape and a stale number, which is worse than none.
  mcp-registry:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release.outputs.tag }}
      SERVER_NAME: io.github.JAAvila-Of/vivac
      # Pinned by version and by hash, checked against the checksums file the
      # registry publishes with that release. A tool that signs in as this
      # project is not one to take from whatever `latest` is today.
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          printf '%s  mcp-publisher.tar.gz\n' "$PUBLISHER_SHA256" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # The registry proves the crate is ours by finding the server name in the
      # README crates.io renders for this version, and crates.io renders it on
      # its own schedule, after the upload has already succeeded. Publishing
      # before it is there fails for a reason that fixes itself a minute later.
      - name: Wait for crates.io to serve this version's README
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for _ in $(seq 1 30); do
            # Into a variable first: `grep -q` stops reading at the first
            # match, curl then dies writing to a closed pipe, and under
            # pipefail a README that has the line would read as one that
            # does not.
            readme=$(curl -fsSL -A "vivac release (github.com/JAAvila-Of/vivac)" \
              "https://crates.io/api/v1/crates/vivac/${version}/readme" || true)
            if grep -qF "mcp-name: ${SERVER_NAME}" <<< "$readme"; then
              exit 0
            fi
            sleep 20
          done
          printf 'crates.io never served a README for %s with "mcp-name: %s"\n' "$version" "$SERVER_NAME" >&2
          exit 1
      - name: Write server.json for this version
        run: |
          set -euo pipefail
          jq -n --arg name "$SERVER_NAME" --arg version "${TAG#v}" '{
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            name: $name,
            title: "vivac",
            description: "Provenance tree for coding agents: where you are, why, and what was already decided",
            repository: { url: "https://github.com/JAAvila-Of/vivac", source: "github" },
            version: $version,
            packages: [{
              registryType: "cargo",
              identifier: "vivac",
              version: $version,
              transport: { type: "stdio" },
              packageArguments: [{ type: "positional", value: "mcp" }]
            }]
          }' > server.json
          cat server.json
      - name: Publish
        run: |
          set -euo pipefail
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
