# Releasing. The version number and the changelog are computed from the commit
# messages; nothing reaches crates.io until a human merges the release pull
# request. That merge is the gate, and it is the only one.
#
# There are no stored credentials. Publishing authenticates with crates.io over
# OIDC -- GitHub signs a short-lived token, crates.io validates it against
# GitHub's public keys, and it expires within the hour. A long-lived registry
# token would be the most dangerous secret this project could hold: whoever took
# it could publish anything, as us, to everyone who installs vivac.
#
# One manual step per release, and it is a consequence of that choice. A run
# caused by GitHub's own token is held rather than skipped: it is created and
# parked in `action_required`, waiting for somebody to say run it, and `main`
# requires all of them before the release pull request can be merged.
#
# Approving the held run is the whole step. It needs no commit, and it does not
# need the pull request closed and reopened. Pushing a human commit to the
# branch starts them too, but that only helps on the releases where there was
# already a commit to make -- and reaching for it on the others means inventing
# one, which is worse than the problem. The alternative is an app or a personal
# token, which is the credential this file exists to avoid.
#
# The precompiled binaries are built here as well, in the run that made the
# release, rather than by a workflow hanging off the tag. Same rule, second
# mouth: a tag pushed with that token starts nothing either. release.yml
# carries the long version of why.

name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.released.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5.131
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag comes out of the JSON and not out of an output called `tag`,
      # because the version pinned above has no such output -- it reports
      # `prs`, `pr`, `releases`, `prs_created` and `releases_created`, and
      # nothing else. v0.6.8 shipped with no binaries for exactly that reason:
      # the missing output read as an empty tag and the upload skipped itself
      # in silence. `jq -e` is the point of this step: if the shape of that
      # JSON ever changes, this fails here and says so, rather than handing
      # the next job an empty string it will quietly do nothing with.
      - name: Read the tag out of what release-plz reported
        id: released
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          printf 'released: %s\n' "$RELEASES"
          tag=$(printf '%s' "$RELEASES" | jq -er '.[0].tag')
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  # The precompiled binaries, in this same run. They cannot hang off the tag:
  # GitHub starts no workflow for an event caused by its own token, and this
  # job is what release.yml exists to be called from. See its header.
  binaries:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
