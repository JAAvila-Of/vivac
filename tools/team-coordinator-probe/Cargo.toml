[package]
name = "team-coordinator-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[features]
default = ["coordinator-probe"]
coordinator-probe = []
browser-lab = []

[dependencies]
sha2 = "=0.10.9"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = "=0.2.17"
passki = { version = "=0.5.0", default-features = false, features = ["graviola"] }
graviola = "=0.4.5"
base64ct = { version = "=1.8.3", features = ["alloc"] }
url = "=2.5.9"
ciborium = "=0.2.2"

[target.'cfg(target_os = "linux")'.dependencies]
libsqlite3-sys = { version = "=0.39.1", features = ["bundled"] }
libc = "=0.2.189"
