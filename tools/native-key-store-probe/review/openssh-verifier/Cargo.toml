[package]
name = "openssh-proof-verifier-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
