[package]
name = "ssh-writer-graph-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[features]
default = []
heap-probe = []

[dependencies]
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "encryption"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = "=0.2.17"
zeroize = "=1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"
rust-launcher-probe = { path = "../rust-launcher" }
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
