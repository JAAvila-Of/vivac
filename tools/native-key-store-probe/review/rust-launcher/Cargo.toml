[package]
name = "rust-launcher-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
libc = "=0.2.191"
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
zeroize = "=1.9.1"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast", "zeroize"] }
# Parse the existing encrypted package profile without enabling decryption.
ssh-key = { version = "=0.6.7", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
md-5 = { version = "=0.11.0", default-features = false }
